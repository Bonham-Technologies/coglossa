<!doctype html>
<!-- The Open Graph card (1200 × 630). make-images.mjs renders it to public/og-image.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coglossa card</title>
    <style>
      @font-face {
        font-family: "Archivo";
        font-weight: 100 900;
        src: url("../public/fonts/archivo-latin-wght-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        background: #f3f0e8;
        color: #16181a;
        font-family: "Archivo", sans-serif;
        position: relative;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 0;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 28px;
      }
      .lockup i {
        width: 20px;
        height: 20px;
        background: #8f2d5e;
      }
      .lockup b {
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .lockup span {
        color: #4f5559;
        font-size: 24px;
      }
      h1 {
        font-weight: 800;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.025em;
        margin: auto 0 32px;
      }
      h1 em {
        font-style: normal;
        box-shadow: inset 0 -0.1em 0 #8f2d5e;
      }
      p {
        margin: 0;
        font-size: 30px;
        color: #4f5559;
      }
      svg {
        position: absolute;
        right: 80px;
        top: 72px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lockup"><i></i><b>COGLOSSA</b><span>by Bonham Technologies</span></div>
      <h1>Translation that<br /><em>shows its work</em></h1>
      <p>Several translators, one reviewer, every passage checked.</p>
    </div>
    <svg viewBox="0 0 400 130">
      <line x1="264.5" y1="0" x2="264.5" y2="130" stroke="#8a8477" />
      <g fill="#16181a" opacity=".16">
        <rect y="12" width="232" height="6" />
        <rect y="44" width="208" height="6" />
        <rect y="76" width="240" height="6" />
        <rect y="108" width="176" height="6" />
      </g>
      <g fill="#8f2d5e">
        <rect x="96" y="56" width="112" height="2" />
        <rect x="208" y="57" width="72" height="1" />
        <rect x="280" y="53" width="8" height="8" />
      </g>
      <g fill="#16181a" opacity=".4">
        <rect x="296" y="54" width="96" height="6" />
        <rect x="296" y="70" width="64" height="6" />
      </g>
    </svg>
  </body>
</html>
