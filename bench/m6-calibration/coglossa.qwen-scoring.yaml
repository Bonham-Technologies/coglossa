# M6 calibration run: Qwen3.6 translates and reviews; Gemma 4 judges and back-translates.
backends:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY   # never commit the key; load it into the environment
    max_concurrency: 16
    timeout_s: 300
models:
  qwen3.6-35b-a3b:
    backend: openrouter
    name: qwen/qwen3.6-35b-a3b
    context_window: 65536
    structured_output: json_schema
    max_output_tokens: 16384               # a runaway generation stops here
    extra_body:
      reasoning: { enabled: false }          # it thinks by default: many times the tokens
      provider: { require_parameters: true, order: [coreweave, deepinfra, parasail], quantizations: [bf16, fp8] }
  gemma-4-26b-a4b:
    backend: openrouter
    name: google/gemma-4-26b-a4b-it
    context_window: 65536
    structured_output: json_schema
    max_output_tokens: 16384               # a runaway generation stops here
    extra_body:
      provider: { require_parameters: true, order: [coreweave, deepinfra, parasail], quantizations: [bf16, fp8] }
roles:
  literal_translator:    { model: qwen3.6-35b-a3b }
  contextual_translator: { model: qwen3.6-35b-a3b }
  reviewer:              { model: qwen3.6-35b-a3b }
  profiler_guide:        { model: qwen3.6-35b-a3b }
  judge:                 { model: gemma-4-26b-a4b }
  roundtrip:             { model: gemma-4-26b-a4b }
scorer:
  url: http://127.0.0.1:18090
  timeout_s: 3600          # several bench processes share one CPU scorer: requests queue
