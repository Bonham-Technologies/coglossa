# M6 side experiment: Qwen3.6 with Qwen's recommended non-thinking sampling (temperature 0.7,
# presence_penalty 1.5) against its repetition loops. Otherwise as coglossa.qwen-pipeline.yaml.
# Qwen3.6 translates and reviews; Gemma 4 judges and back-translates.
backends:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY   # never commit the key; load it into the environment
    max_concurrency: 8
    timeout_s: 300
models:
  qwen3.6-35b-a3b:
    backend: openrouter
    name: qwen/qwen3.6-35b-a3b
    context_window: 65536
    structured_output: json_schema
    max_output_tokens: 16384               # a runaway generation stops here
    temperature: 0.7
    extra_body:
      presence_penalty: 1.5
      reasoning: { enabled: false }          # it thinks by default: many times the tokens
      provider: { require_parameters: true, order: [coreweave, deepinfra, parasail], quantizations: [bf16, fp8] }
  gemma-4-26b-a4b:
    backend: openrouter
    name: google/gemma-4-26b-a4b-it
    context_window: 65536
    structured_output: json_schema
    max_output_tokens: 16384               # a runaway generation stops here
    extra_body:
      provider: { require_parameters: true, order: [coreweave, deepinfra, parasail], quantizations: [bf16, fp8] }
roles:
  literal_translator:    { model: qwen3.6-35b-a3b }
  contextual_translator: { model: qwen3.6-35b-a3b }
  reviewer:              { model: qwen3.6-35b-a3b }
  profiler_guide:        { model: qwen3.6-35b-a3b }
  judge:                 { model: gemma-4-26b-a4b }
  roundtrip:             { model: gemma-4-26b-a4b }
# No scorer: bench measures the translations itself; the run's own span scores would only add
# scorer load. bench flags uses coglossa.qwen-scoring.yaml, the same with the scorer.
