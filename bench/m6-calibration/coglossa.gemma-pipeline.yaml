# M6 calibration run: Gemma 4 translates and reviews; Qwen3.6 judges and back-translates.
backends:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY   # never commit the key; load it into the environment
    max_concurrency: 8
    timeout_s: 300
models:
  qwen3.6-35b-a3b:
    backend: openrouter
    name: qwen/qwen3.6-35b-a3b
    context_window: 65536
    structured_output: json_schema
    max_output_tokens: 16384               # a runaway generation stops here
    extra_body:
      reasoning: { enabled: false }          # it thinks by default: many times the tokens
      provider: { require_parameters: true, order: [coreweave, deepinfra, parasail], quantizations: [bf16, fp8] }
  gemma-4-26b-a4b:
    backend: openrouter
    name: google/gemma-4-26b-a4b-it
    context_window: 65536
    structured_output: json_schema
    max_output_tokens: 16384               # a runaway generation stops here
    extra_body:
      provider: { require_parameters: true, order: [coreweave, deepinfra, parasail], quantizations: [bf16, fp8] }
roles:
  literal_translator:    { model: gemma-4-26b-a4b }
  contextual_translator: { model: gemma-4-26b-a4b }
  reviewer:              { model: gemma-4-26b-a4b }
  profiler_guide:        { model: gemma-4-26b-a4b }
  judge:                 { model: qwen3.6-35b-a3b }
  roundtrip:             { model: qwen3.6-35b-a3b }
# No scorer: bench measures the translations itself; the run's own span scores would only add
# scorer load. bench flags uses coglossa.gemma-scoring.yaml, the same with the scorer.
