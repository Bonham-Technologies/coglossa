[project]
name = "coglossa"
version = "0.1.0"
description = "Multi-agent translation with verifiable, scored output"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-docx>=1.2,<2",
  "lxml>=5.2,<7",
  "pdfminer.six>=20240706",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "procrastinate>=3.10,<3.11",
]

[project.optional-dependencies]
s3 = ["boto3>=1.36,<2"]  # storage.kind: s3; an air-gapped install never needs it

[project.scripts]
coglossa = "coglossa.cli:main"

[project.entry-points."coglossa.backends"]
[project.entry-points."coglossa.ingestors"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "boto3>=1.36,<2",
  "moto[s3]>=5.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coglossa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "--cov=coglossa --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["coglossa"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
