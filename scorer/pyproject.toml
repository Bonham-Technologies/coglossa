[project]
name = "coglossa-scorer"
version = "0.1.0"
description = "Coglossa scoring service: MetricX-24 quality estimation and LaBSE similarity"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9,<3",
  "transformers[sentencepiece]>=4.44",  # sentencepiece + protobuf: mt5 ships spiece.model only
  "sentencepiece>=0.2",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
  "safetensors>=0.4",
]

[project.scripts]
coglossa-scorer = "coglossa_scorer.cli:main"
coglossa-scorer-weights = "coglossa_scorer.weights:main"

# torch comes in one of two builds, both in uv.lock with their hashes (CGL-50): the `cpu` group
# (a default group, so `uv sync` and `uv run` get it) or the `cu126` extra (the GPU image, the
# bundle and the hosted scorer: uv sync --no-default-groups --extra cu126). The two conflict.
# sentence-transformers needs torch, so it sits with it: no install takes torch from PyPI on
# Linux. Below 2.15: the CUDA 12.6 index (Makefile CUDA_INDEX) stops at 2.14.1, and CUDA 12
# keeps the NVIDIA driver minimum at 525 (CGL-76). Keep the two lists the same.
# So the built wheel does not require torch: an install outside uv (pip, a wheel) needs torch
# and sentence-transformers installed alongside it ([cu126] would take torch from PyPI).
[project.optional-dependencies]
cu126 = ["torch>=2.2,<2.15", "sentence-transformers>=3.0"]

# `build` locks the build backend (build-system.requires) with its hashes: the images build the
# scorer's wheel with it as --build-constraints and --require-build-hashes (CGL-130). Keep it
# listing every build-system requirement; deploy/tests/check_scorer_lock.py checks it does.
[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx2>=2.13", "jsonschema>=4.23", "ruff>=0.7"]
cpu = ["torch>=2.2,<2.15", "sentence-transformers>=3.0"]
build = ["hatchling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coglossa_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=coglossa_scorer --cov-branch --cov-report=term-missing --cov-fail-under=95"
markers = ["realmodels: needs real model weights (set COGLOSSA_REAL_MODELS=1)"]

[tool.coverage.run]
branch = true
source = ["coglossa_scorer"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "^\\s*\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# On Linux each torch build comes only from its PyTorch index. The indexes are explicit, so
# nothing else is taken from them: every other package comes from PyPI. Apple Silicon (a dev
# box only) gets PyPI's torch.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { extra = "cu126" }]]
# The scorer runs on Linux, as the client's image does. Intel macOS has no torch wheels after
# 2.2.2, so it is not in the lock: there, `make test-scorer` and the other scorer targets run in
# a Linux container (deploy/docker/scorer-dev.Dockerfile), at parity with the client.
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
